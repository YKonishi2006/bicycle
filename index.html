<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚲 通学時刻表アプリ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            margin: 0; padding: 10px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; color: #333;
        }
        .container { max-width: 480px; margin: auto; }
        h1 { text-align: center; color: white; margin-bottom: 15px; font-size: 1.5em; }
        
        .card { 
            background: rgba(255,255,255,0.95); 
            border-radius: 20px; padding: 20px; 
            margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        #currentTime { font-size: 1em; color: #666; font-weight: bold; }
        #timer { font-size: 2.5em; color: #4facfe; font-weight: 700; margin: 5px 0; }

        .route-select { 
            background: #eee; border: none; border-radius: 10px; 
            padding: 10px; font-size: 16px; width: 100%; margin-bottom: 15px;
        }

        #actionArea { min-height: 80px; display: flex; align-items: center; justify-content: center; }

        .main-btn { 
            background: linear-gradient(45deg, #4facfe, #00f2fe); 
            color: white; border: none; border-radius: 15px; 
            padding: 18px; font-size: 1.3em; font-weight: 700; 
            cursor: pointer; width: 100%; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(79,172,254,0.4);
        }
        
        .arrive-btn { background: linear-gradient(45deg, #feca57, #ff9f43); }
        .depart-btn { background: linear-gradient(45deg, #4facfe, #00f2fe); }
        .goal-btn { background: linear-gradient(45deg, #1dd1a1, #10ac84); }
        .main-btn:active { transform: scale(0.95); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 10px; overflow: hidden; }
        th { font-size: 0.75em; color: #999; padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        td { padding: 12px 8px; border-bottom: 1px solid #eee; font-size: 0.9em; position: relative; }
        
        .place-name { font-weight: bold; }
        .time-cell { font-family: 'monospace'; font-weight: bold; color: #555; }
        .delay-mark { color: #ff6b6b; font-size: 0.8em; font-weight: bold; margin-left: 5px; }
        .done-row { background-color: #f0f0f0; color: #ccc !important; }
        .done-row .time-cell { color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-bicycle"></i> 通学時刻表</h1>
        
        <div class="card">
            <div id="currentTime">現在時刻 00:00:00</div>
            <div id="timer">00:00</div>
        </div>

        <div class="card">
            <div id="setupArea">
                <select id="route" class="route-select">
                    <option value="down_musashino">下り むさしの</option>
                    <option value="down_alpha">下り α</option>
                    <option value="up_musashino">上り むさしの</option>
                    <option value="up_alpha">上り α</option>
                </select>
                <button id="startBtn" class="main-btn"><i class="fas fa-play"></i> 出発！</button>
            </div>
            <div id="actionArea" style="display:none;"></div>
        </div>
        
        <div class="card">
            <table id="timetable">
                <thead>
                    <tr><th style="width: 35%;">場所</th><th style="width: 65%;">予定 / 結果</th></tr>
                </thead>
                <tbody>
                    <tr><td colspan="2" style="text-align:center; padding:20px; color:#999;">出発ボタンを押して開始</td></tr>
                </tbody>
            </table>
            <button id="resetBtn" style="margin-top:15px; background:none; border:none; color:#999; text-decoration:underline; font-size:0.8em; cursor:pointer;">設定に戻る</button>
        </div>
    </div>

    <script>
        const routeSettings = {
            "down_musashino": [
                { name: "下保谷", move: 7, stop: 0 },
                { name: "住吉会館", move: 6, stop: 0 },
                { name: "田無町3丁目", move: 6, stop: 1 },
                { name: "五日市", move: 2, stop: 0 },
                { name: "桜橋", move: 3, stop: 0 },
                { name: "武蔵境", move: 10, stop: 0 },
                { name: "新大沢", move: 0, stop: 0 }
            ],
            "down_alpha": [
                { name: "下保谷", move: 15, stop: 0 },
                { name: "田無町3丁目", move: 7, stop: 1 },
                { name: "五日市", move: 	4, stop: 0 },
                { name: "桜橋", move: 4, stop: 0 },
                { name: "武蔵境", move: 10, stop: 0 },
                { name: "新大沢", move: 0, stop: 0 }
            ],
            "up_musashino": [
                { name: "新大沢", move: 10, stop: 0 },
                { name: "武蔵境", move: 5, stop: 0 },
                { name: "五日市", move: 	7, stop: 0 },
                { name: "田無町3丁目", move: 7, stop: 1 },
                { name: "住吉会館", move: 7, stop: 0 },
                { name: "下保谷", move: 0, stop: 0 }
            ],
            "up_alpha": [
                { name: "新大沢", move: 10, stop: 0 },
                { name: "武蔵境", move: 2, stop: 0 },
                { name: "桜橋", move: 3, stop: 0 },
                { name: "五日市", move: 	6, stop: 0 },
                { name: "田無町3丁目", move: 15, stop: 1 },
                { name: "下保谷", move: 0, stop: 0 }
            ]
        };

        let currentStep = 0;
        let routeData = [];
        let scheduledTimes = [];

        const setupArea = document.getElementById('setupArea');
        const actionArea = document.getElementById('actionArea');
        const startBtn = document.getElementById('startBtn');
        const routeSelect = document.getElementById('route');
        const tbody = document.querySelector('#timetable tbody');

        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').textContent = `現在時刻 ${now.toTimeString().slice(0, 8)}`;
            document.getElementById('timer').textContent = now.toTimeString().slice(3, 8); 
        }
        setInterval(updateClock, 1000);
        updateClock();

        function updateActionButton() {
            actionArea.innerHTML = '';
            const step = routeData[currentStep];
            const btn = document.createElement('button');
            btn.className = 'main-btn';

            if (step.type === 'start') {
                btn.innerHTML = `<i class="fas fa-bicycle"></i> ${step.name}を出発`;
                btn.classList.add('depart-btn');
            } else if (step.type === 'goal') {
                btn.innerHTML = `<i class="fas fa-flag-checkered"></i> ${step.name}に到着！`;
                btn.classList.add('goal-btn');
            } else if (step.type === 'arrive') {
                btn.innerHTML = `<i class="fas fa-map-marker-alt"></i> ${step.name}に到着`;
                btn.classList.add('arrive-btn');
            } else if (step.type === 'depart') {
                btn.innerHTML = `<i class="fas fa-play"></i> ${step.name}を出発`;
                btn.classList.add('depart-btn');
            }

            btn.onclick = nextStep;
            actionArea.appendChild(btn);
        }

        function nextStep() {
            const now = new Date();
            const step = routeData[currentStep];
            const rows = tbody.querySelectorAll('tr');
            const targetRow = rows[step.placeIndex];
            
            // 遅延チェック (到着時のみ)
            if (step.type === 'arrive' || step.type === 'goal') {
                const scheduled = scheduledTimes[step.placeIndex].arrival;
                const diff = Math.floor((now - scheduled) / 60000);
                if (diff >= 1) {
                    const delaySpan = document.createElement('span');
                    delaySpan.className = 'delay-mark';
                    delaySpan.innerHTML = `⚠️+${diff}分`;
                    targetRow.cells[1].appendChild(delaySpan);
                }
            }

            // 出発したら行を薄くする
            if (step.type.includes('depart') || step.type === 'start') {
                targetRow.classList.add('done-row');
            }

            currentStep++;
            if (currentStep < routeData.length) {
                updateActionButton();
            } else {
                actionArea.innerHTML = '<p style="font-weight:bold; color:#10ac84;">到着しました！</p>';
            }
        }

        startBtn.onclick = function() {
            const selectedRoute = routeSelect.value;
            const segments = routeSettings[selectedRoute];
            let currentTime = new Date();
            
            tbody.innerHTML = '';
            routeData = [];
            scheduledTimes = [];
            currentStep = 0;

            segments.forEach((seg, index) => {
                const tr = document.createElement('tr');
                const arrival = index === 0 ? null : new Date(currentTime);
                
                if (index !== 0 && index !== segments.length - 1) {
                    currentTime.setMinutes(currentTime.getMinutes() + seg.stop);
                }
                const departure = index === segments.length - 1 ? null : new Date(currentTime);

                scheduledTimes.push({ arrival, departure });

                const arrivalStr = arrival ? arrival.toTimeString().slice(0, 5) : "";
                const departureStr = departure ? departure.toTimeString().slice(0, 5) : "";
                const planText = index === 0 ? `${departureStr} 発` : 
                                 index === segments.length - 1 ? `${arrivalStr} 着` : 
                                 `${arrivalStr}着 / ${departureStr}発`;

                tr.innerHTML = `<td class="place-name">${seg.name}</td><td class="time-cell">${planText}</td>`;
                tbody.appendChild(tr);

                if (index === 0) {
                    routeData.push({ type: 'start', name: seg.name, placeIndex: index });
                } else if (index === segments.length - 1) {
                    routeData.push({ type: 'goal', name: seg.name, placeIndex: index });
                } else {
                    routeData.push({ type: 'arrive', name: seg.name, placeIndex: index });
                    routeData.push({ type: 'depart', name: seg.name, placeIndex: index });
                }

                currentTime.setMinutes(currentTime.getMinutes() + seg.move);
            });

            setupArea.style.display = 'none';
            actionArea.style.display = 'flex';
            updateActionButton();
        };

        document.getElementById('resetBtn').onclick = function() {
            setupArea.style.display = 'block';
            actionArea.style.display = 'none';
            tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; padding:20px; color:#999;">出発ボタンを押して開始</td></tr>';
        };
    </script>
</body>
</html>
