<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自転車通学時刻表</title>
    <style>
        body { font-family: sans-serif; margin: 20px; max-width: 400px; margin: auto; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; }
        select, input { padding: 10px; margin: 5px; font-size: 16px; width: 100%; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>自転車通学時刻表アプリ</h1>
    
    <label>ルート選択:</label>
    <select id="route">
        <option value="1">ルート1 (A,B,C,D,E - 5箇所)</option>
        <option value="2">ルート2 (B,C,D,E - 4箇所)</option>
    </select>
    
    <div id="measureSection">
        <h2>時間測定</h2>
        <button id="startBtn">出発（区間開始）</button>
        <button id="arriveBtn" class="hidden">到着（区間終了）</button>
        <button id="stopBtn" class="hidden">停車終了</button>
        <button id="saveBtn">測定保存</button>
        <p id="timer">00:00:00</p>
        <p>現在区間: <span id="currentSegment">-</span></p>
        <h3>今回測定:</h3>
        <table id="currentData">
            <thead><tr><th>区間</th><th>移動時間</th><th>停車時間</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
    
    <div id="dataSection">
        <h2>測定データ（平均）</h2>
        <table id="avgData">
            <thead><tr><th>区間</th><th>移動(分)</th><th>停車(分)</th></tr></thead>
            <tbody></tbody>
        </table>
        <button id="clearData">データクリア</button>
    </div>
    
    <div id="timetableSection">
        <h2>時刻表生成</h2>
        <label>発車時刻: <input type="time" id="departTime" value="07:00"></label>
        <button id="generateBtn">発車</button>
        <table id="timetable" class="hidden">
            <thead><tr><th>場所</th><th>到着</th><th>出発</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        // データ構造
        let data = JSON.parse(localStorage.getItem('bikeData')) || {1: [], 2: []};
        let currentRoute = 1;
        let currentData = [];
        let timerInterval;
        let startTime, stopTime;
        let currentSegment = 0; // 0-based index

        const stops = {1: ['出発', 'A', 'B', 'C', 'D', 'E'], 2: ['出発', 'B', 'C', 'D', 'E']};

        // ルート変更
        document.getElementById('route').addEventListener('change', (e) => {
            currentRoute = parseInt(e.target.value);
            loadAvgData();
        });

        // タイマー
        function updateTimer() {
            const now = Date.now();
            const elapsed = Math.floor((now - startTime) / 1000);
            const h = Math.floor(elapsed / 3600).toString().padStart(2, '0');
            const m = Math.floor((elapsed % 3600) / 3600).toString().padStart(2, '0');
            const s = Math.floor((elapsed % 60)).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${h}:${m}:${s}`;
        }

        // 出発ボタン
        document.getElementById('startBtn').addEventListener('click', () => {
            currentData = [{move: 0, stop: 0}];
            currentSegment = 0;
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            document.getElementById('startBtn').classList.add('hidden');
            document.getElementById('arriveBtn').classList.remove('hidden');
            document.getElementById('currentSegment').textContent = stops[currentRoute][0] + ' → ' + stops[currentRoute][1];
            updateCurrentTable();
        });

        // 到着ボタン
        document.getElementById('arriveBtn').addEventListener('click', () => {
            const moveTime = Date.now() - startTime;
            currentData[currentSegment].move = Math.round(moveTime / 60000); // 分単位
            stopTime = Date.now();
            document.getElementById('arriveBtn').classList.add('hidden');
            document.getElementById('stopBtn').classList.remove('hidden');
            document.getElementById('currentSegment').textContent = stops[currentRoute][currentSegment + 1];
        });

        // 停車終了ボタン
        document.getElementById('stopBtn').addEventListener('click', () => {
            const stopTimeElapsed = Date.now() - stopTime;
            currentData[currentSegment].stop = Math.round(stopTimeElapsed / 60000);
            currentSegment++;
            if (currentSegment >= stops[currentRoute].length - 1) {
                clearInterval(timerInterval);
                document.getElementById('stopBtn').classList.add('hidden');
                document.getElementById('saveBtn').classList.remove('hidden');
                return;
            }
            document.getElementById('stopBtn').classList.add('hidden');
            document.getElementById('arriveBtn').classList.remove('hidden');
            startTime = Date.now();
            document.getElementById('currentSegment').textContent = stops[currentRoute][currentSegment + 1] + ' → ' + stops[currentRoute][currentSegment + 2];
            updateCurrentTable();
        });

        function updateCurrentTable() {
            const tbody = document.querySelector('#currentData tbody');
            tbody.innerHTML = '';
            currentData.slice(0, currentSegment + 1).forEach((seg, i) => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = stops[currentRoute][i] + '-' + stops[currentRoute][i+1];
                row.insertCell(1).textContent = seg.move || '-';
                row.insertCell(2).textContent = seg.stop || '-';
            });
        }

        // 保存
        document.getElementById('saveBtn').addEventListener('click', () => {
            data[currentRoute].push([...currentData]);
            localStorage.setItem('bikeData', JSON.stringify(data));
            loadAvgData();
            alert('保存しました！');
            resetMeasure();
        });

        function resetMeasure() {
            clearInterval(timerInterval);
            document.getElementById('startBtn').classList.remove('hidden');
            document.getElementById('arriveBtn').classList.add('hidden');
            document.getElementById('stopBtn').classList.add('hidden');
            document.getElementById('saveBtn').classList.add('hidden');
            document.getElementById('timer').textContent = '00:00:00';
            document.querySelector('#currentData tbody').innerHTML = '';
        }

        // 平均データ表示
        function loadAvgData() {
            const avg = {};
            const measurements = data[currentRoute];
            if (measurements.length === 0) return;
            const numStops = stops[currentRoute].length - 1;
            for (let i = 0; i < numStops; i++) {
                let totalMove = 0, totalStop = 0;
                measurements.forEach(m => {
                    totalMove += m[i]?.move || 0;
                    totalStop += m[i]?.stop || 0;
                });
                avg[i] = {
                    move: Math.round(totalMove / measurements.length * 10) / 10,
                    stop: Math.round(totalStop / measurements.length * 10) / 10
                };
            }
            const tbody = document.querySelector('#avgData tbody');
            tbody.innerHTML = '';
            Object.keys(avg).forEach(i => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = stops[currentRoute][parseInt(i)] + '-' + stops[currentRoute][parseInt(i)+1];
                row.insertCell(1).textContent = avg[i].move;
                row.insertCell(2).textContent = avg[i].stop;
            });
        }
        loadAvgData();

        // データクリア
        document.getElementById('clearData').addEventListener('click', () => {
            if (confirm('データをクリアしますか？')) {
                data[currentRoute] = [];
                localStorage.setItem('bikeData', JSON.stringify(data));
                loadAvgData();
            }
        });

        // 時刻表生成
        document.getElementById('generateBtn').addEventListener('click', () => {
            const departStr = document.getElementById('departTime').value;
            let [h, m] = departStr.split(':').map(Number);
            let currentMin = h * 60 + m;
            const tbody = document.querySelector('#timetable tbody');
            tbody.innerHTML = '';
            const avg = getAvgTimes();
            stops[currentRoute].forEach((stop, i) => {
                if (i === 0) {
                    const row = tbody.insertRow();
                    row.insertCell(0).textContent = stop;
                    row.insertCell(1).textContent = '-';
                    row.insertCell(2).textContent = `${Math.floor(currentMin/60).toString().padStart(2,'0')}:${(currentMin%60).toString().padStart(2,'0')}`;
                    return;
                }
                const prevIdx = i - 1;
                currentMin += avg[prevIdx]?.move || 0;
                const arriveStr = `${Math.floor(currentMin/60).toString().padStart(2,'0')}:${(currentMin%60).toString().padStart(2,'0')}`;
                currentMin += avg[prevIdx]?.stop || 0;
                const departStr = `${Math.floor(currentMin/60).toString().padStart(2,'0')}:${(currentMin%60).toString().padStart(2,'0')}`;
                const row = tbody.insertRow();
                row.insertCell(0).textContent = stop;
                row.insertCell(1).textContent = arriveStr;
                row.insertCell(2).textContent = i === stops[currentRoute].length - 1 ? '-' : departStr;
            });
            document.getElementById('timetable').classList.remove('hidden');
        });

        function getAvgTimes() {
            // avgDataから平均取得（簡易）
            const avg = {};
            document.querySelectorAll('#avgData tbody tr').forEach((row, i) => {
                avg[i] = {
                    move: parseFloat(row.cells[1].textContent) || 0,
                    stop: parseFloat(row.cells[2].textContent) || 0
                };
            });
            return avg;
        }
    </script>
</body>
</html>
